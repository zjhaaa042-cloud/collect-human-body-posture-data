<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体态数据采集系统 - 测试页面</title>
    <style>
        :root {
            --primary: #2F6F9F;
            --accent: #1F9D8A;
            --bg: #EEF3F7;
            --card: #FFFFFF;
            --border: #D7E1E8;
            --text: #1F2A33;
            --muted: #60727F;
            --error: #C84A4A;
            --warning: #C58A12;
        }

        body {
            font-family: 'MiSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            width: min(620px, 100%);
        }

        h1 {
            color: var(--primary);
            margin-bottom: 8px;
        }

        p {
            color: var(--muted);
        }

        .status {
            background: var(--card);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid var(--border);
            box-shadow: 0 10px 28px rgba(23, 42, 58, 0.10);
        }

        .status-item {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .status-label {
            color: var(--muted);
        }

        .status-value {
            font-weight: 600;
        }

        .connected {
            color: var(--accent);
        }

        .disconnected {
            color: var(--error);
        }

        button {
            background: linear-gradient(180deg, #3479AA, var(--primary));
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            margin: 8px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(47, 111, 159, 0.22);
        }

        .log {
            background: #0E151B;
            color: #D7E5EE;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
            font-family: Consolas, Monaco, monospace;
            font-size: 14px;
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid #22313C;
        }

        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .log-info {
            color: #B8CAD6;
        }

        .log-success {
            color: #5AD6C2;
        }

        .log-error {
            color: #F08A8A;
        }

        .log-warning {
            color: #F3C15E;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>体态数据采集系统</h1>
        <p>WebSocket 连接测试</p>

        <div class="status">
            <div class="status-item">
                <span class="status-label">WebSocket 状态</span>
                <span class="status-value" id="ws-status">未连接</span>
            </div>
            <div class="status-item">
                <span class="status-label">相机状态</span>
                <span class="status-value" id="camera-status">未知</span>
            </div>
            <div class="status-item">
                <span class="status-label">语音状态</span>
                <span class="status-value" id="voice-status">未知</span>
            </div>
        </div>

        <button onclick="connect()">连接 WebSocket</button>
        <button onclick="disconnect()">断开连接</button>
        <button onclick="clearLog()">清空日志</button>

        <div class="log" id="log">
            <div class="log-entry log-info">等待连接...</div>
        </div>
    </div>

    <script>
        let ws = null;
        const logDiv = document.getElementById('log');
        const wsStatus = document.getElementById('ws-status');

        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStatus(element, text, connected = false) {
            element.textContent = text;
            element.className = `status-value ${connected ? 'connected' : 'disconnected'}`;
        }

        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                addLog('已连接，无需重复连接', 'warning');
                return;
            }

            addLog('正在连接 ws://localhost:8765...', 'info');
            ws = new WebSocket('ws://localhost:8765');

            ws.onopen = () => {
                addLog('WebSocket 连接成功', 'success');
                updateStatus(wsStatus, '已连接', true);
                ws.send(JSON.stringify({ type: 'start_preview' }));
                addLog('已发送 start_preview 命令', 'info');
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    addLog(`收到消息：${data.type}`, 'info');

                    if (data.type === 'preview_frame') {
                        addLog('收到预览帧数据', 'success');
                    }
                } catch (e) {
                    addLog(`解析消息失败：${e.message}`, 'error');
                }
            };

            ws.onclose = () => {
                addLog('WebSocket 连接已关闭', 'warning');
                updateStatus(wsStatus, '已断开', false);
            };

            ws.onerror = () => {
                addLog('WebSocket 连接错误', 'error');
                updateStatus(wsStatus, '连接错误', false);
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                addLog('已断开连接', 'info');
            }
        }

        function clearLog() {
            logDiv.innerHTML = '<div class="log-entry log-info">日志已清空</div>';
        }

        setTimeout(connect, 1000);
    </script>
</body>
</html>

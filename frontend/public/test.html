<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体态数据采集系统 - 测试页面</title>
    <style>
        body {
            font-family: 'MiSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0D0D0D;
            color: #FFFFFF;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        h1 {
            color: #FF6900;
            margin-bottom: 20px;
        }
        .status {
            background: #1A1A1A;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .status-item {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-label {
            color: #B3B3B3;
        }
        .status-value {
            font-weight: 500;
        }
        .connected {
            color: #00C853;
        }
        .disconnected {
            color: #FF1744;
        }
        button {
            background: linear-gradient(135deg, #FF6900, #E55D00);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 105, 0, 0.4);
        }
        .log {
            background: #1A1A1A;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
            font-family: monospace;
            font-size: 14px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .log-info {
            color: #B3B3B3;
        }
        .log-success {
            color: #00C853;
        }
        .log-error {
            color: #FF1744;
        }
        .log-warning {
            color: #FFD600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>体态数据采集系统</h1>
        <p>WebSocket 连接测试</p>
        
        <div class="status">
            <div class="status-item">
                <span class="status-label">WebSocket 状态:</span>
                <span class="status-value" id="ws-status">未连接</span>
            </div>
            <div class="status-item">
                <span class="status-label">相机状态:</span>
                <span class="status-value" id="camera-status">未知</span>
            </div>
            <div class="status-item">
                <span class="status-label">语音状态:</span>
                <span class="status-value" id="voice-status">未知</span>
            </div>
        </div>
        
        <button onclick="connect()">连接 WebSocket</button>
        <button onclick="disconnect()">断开连接</button>
        <button onclick="clearLog()">清空日志</button>
        
        <div class="log" id="log">
            <div class="log-entry log-info">等待连接...</div>
        </div>
    </div>

    <script>
        let ws = null;
        const logDiv = document.getElementById('log');
        const wsStatus = document.getElementById('ws-status');
        const cameraStatus = document.getElementById('camera-status');
        const voiceStatus = document.getElementById('voice-status');

        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStatus(element, text, connected = false) {
            element.textContent = text;
            element.className = `status-value ${connected ? 'connected' : 'disconnected'}`;
        }

        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                addLog('已连接，无需重复连接', 'warning');
                return;
            }

            addLog('正在连接 ws://localhost:8765...', 'info');
            ws = new WebSocket('ws://localhost:8765');

            ws.onopen = () => {
                addLog('WebSocket 连接成功!', 'success');
                updateStatus(wsStatus, '已连接', true);
                
                // Start preview
                ws.send(JSON.stringify({ type: 'start_preview' }));
                addLog('已发送 start_preview 命令', 'info');
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    addLog(`收到消息: ${data.type}`, 'info');
                    
                    if (data.type === 'preview_frame') {
                        addLog('收到预览帧数据', 'success');
                    }
                } catch (e) {
                    addLog(`解析消息失败: ${e.message}`, 'error');
                }
            };

            ws.onclose = () => {
                addLog('WebSocket 连接已关闭', 'warning');
                updateStatus(wsStatus, '已断开', false);
            };

            ws.onerror = (error) => {
                addLog('WebSocket 连接错误', 'error');
                updateStatus(wsStatus, '连接错误', false);
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                addLog('已断开连接', 'info');
            }
        }

        function clearLog() {
            logDiv.innerHTML = '<div class="log-entry log-info">日志已清空</div>';
        }

        // Auto connect on page load
        setTimeout(connect, 1000);
    </script>
</body>
</html>
